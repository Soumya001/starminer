name: Build StarMiner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libcurl4-openssl-dev
      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.14
        with:
          cuda: '12.0.0'
          method: network
      - name: Build CUDA version
        run: |
          mkdir build && cd build
          cmake .. -DCOLLIDER_USE_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES="60;70;80;86;89"
          make starminer -j$(nproc)
      - name: Upload Linux CUDA binary
        uses: actions/upload-artifact@v4
        with:
          name: starminer-linux-x64-cuda
          path: build/starminer

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
      - name: Install dependencies
        run: |
          C:\vcpkg\vcpkg.exe install curl openssl --triplet=x64-windows
      - name: Build with CMake
        run: |
          mkdir build
          cd build
          cmake .. -DCOLLIDER_USE_CUDA=OFF -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake
          cmake --build . --target starminer --config Release
      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: starminer-windows-x64-cuda
          path: build/Release/starminer.exe

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew install cmake curl openssl
      - name: Build Metal version
        run: |
          mkdir build && cd build
          cmake .. -DCOLLIDER_USE_METAL=ON -DCOLLIDER_USE_CUDA=OFF
          make starminer -j$(sysctl -n hw.ncpu)
      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: starminer-macos-arm64
          path: build/starminer
