name: Build and Release StarMiner

# Builds starminer for all platforms and publishes binaries to GitHub Releases.
# Binary names match exactly what install-135.sh / install-135.ps1 download:
#   starminer-linux-x64-cuda
#   starminer-linux-x64-cpu
#   starminer-windows-x64-cuda.exe
#   starminer-windows-x64-cpu.exe
#   starminer-macos-arm64
#
# Trigger: push a tag  v1.5.1  →  builds all platforms + creates release
#          workflow_dispatch     →  builds all platforms (no release)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Linux x64 — CUDA ────────────────────────────────────────────────
  linux-cuda:
    name: Linux x64 (CUDA)
    runs-on: ubuntu-22.04
    container:
      image: nvidia/cuda:12.8.0-devel-ubuntu22.04
    steps:
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y git cmake ninja-build libcurl4-openssl-dev wget gpg ca-certificates
          # CMake 3.28+ needed for CUDA C++20
          wget -qO- https://apt.kitware.com/keys/kitware-archive-latest.asc \
            | gpg --dearmor -o /usr/share/keyrings/kitware-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] \
            https://apt.kitware.com/ubuntu/ jammy main" \
            > /etc/apt/sources.list.d/kitware.list
          apt-get update -qq && apt-get install -y cmake

      - uses: actions/checkout@v6.0.2

      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DSTARMINER_USE_CUDA=ON \
             \
            -DSTARMINER_BUILD_TESTS=OFF \
            -DSTARMINER_BUILD_BENCHMARKS=OFF \
            -DCMAKE_CUDA_ARCHITECTURES="61;70;75;80;86;89;100;120"
          cmake --build build --target starminer -j4
          strip build/starminer

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: starminer-linux-x64-cuda
          path: build/starminer

  # ── Linux x64 — CPU ─────────────────────────────────────────────────
  linux-cpu:
    name: Linux x64 (CPU)
    runs-on: ubuntu-22.04
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev

      - uses: actions/checkout@v6.0.2

      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DSTARMINER_USE_CUDA=OFF \
             \
            -DSTARMINER_BUILD_TESTS=OFF \
            -DSTARMINER_BUILD_BENCHMARKS=OFF
          cmake --build build --target starminer -j4
          strip build/starminer

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: starminer-linux-x64-cpu
          path: build/starminer

  # ── Windows x64 — CUDA ──────────────────────────────────────────────
  windows-cuda:
    name: Windows x64 (CUDA)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install CUDA 12.8
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.8.0"
          method: network
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'

      - name: Install Ninja
        run: choco install ninja -y

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} ^
            -DVCPKG_TARGET_TRIPLET=x64-windows-static ^
            -DSTARMINER_USE_CUDA=ON ^
            -DSTARMINER_BUILD_TESTS=OFF ^
            -DSTARMINER_BUILD_BENCHMARKS=OFF ^
            -DCMAKE_CUDA_ARCHITECTURES="61;70;75;80;86;89;100;120"
          cmake --build build --target starminer -j4

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: starminer-windows-x64-cuda
          path: build\starminer.exe

  # ── Windows x64 — HIP/AMD (RDNA1+: RX 5000/6000/7000) ─────────────
  windows-hip:
    name: Windows x64 (HIP/AMD)
    runs-on: windows-2022
    continue-on-error: true
    env:
      HIP_VERSION: "6.3.0"
      HIP_PATH: "C:\\Program Files\\AMD\\ROCm\\6.3"
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Cache AMD HIP SDK
        id: cache-hip
        uses: actions/cache@v4
        with:
          path: ${{ env.HIP_PATH }}
          key: amd-hip-sdk-${{ env.HIP_VERSION }}-windows

      - name: Install AMD HIP SDK
        if: steps.cache-hip.outputs.cache-hit != 'true'
        shell: powershell
        timeout-minutes: 40
        run: |
          $url      = "https://download.amd.com/developer/eula/rocm-hub/AMD-Software-PRO-Edition-24.Q4-Win10-Win11-For-HIP.exe"
          $inst     = "$env:TEMP\hip-sdk.exe"
          $ext1     = "$env:TEMP\hip-ext1"
          $ext2     = "$env:TEMP\hip-ext2"
          $7z       = "C:\Program Files\7-Zip\7z.exe"
          $hipPath  = "${{ env.HIP_PATH }}"

          Write-Host "Downloading..."
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $url -OutFile $inst -UseBasicParsing
          Write-Host "Downloaded $((Get-Item $inst).Length) bytes"

          Write-Host "Extracting outer installer..."
          & $7z x $inst -o"$ext1" -y | Out-Null

          # The structure is:
          #   Packages\Apps\ROCmSDKPackages\SDKCore\          <- hipcc, clang HIP compiler
          #   Packages\Apps\ROCmSDKPackages\LibrariesDevelopment\  <- headers + lib
          # Each subfolder contains one .msi — extract them all with 7z
          $rocmPkgs = "$ext1\Packages\Apps\ROCmSDKPackages"
          $targets  = @("SDKCore", "LibrariesDevelopment", "LibrariesRuntime")

          foreach ($t in $targets) {
            $msi = Get-ChildItem "$rocmPkgs\$t" -Filter "*.msi" -ErrorAction SilentlyContinue |
                   Select-Object -First 1
            if ($msi) {
              Write-Host "Extracting $t ($($msi.Name))..."
              & $7z x $msi.FullName -o"$ext2\$t" -y | Out-Null
            } else {
              Write-Host "No .msi in $t (skipping)"
            }
          }

          # Use lessmsi — reads MSI database directly, zero custom actions run
          # msiexec /i and /a both trigger AMD's hardware-check custom actions
          $lessmsiZip = "$env:TEMP\lessmsi.zip"
          $lessmsiDir = "$env:TEMP\lessmsi"
          $lessmsi    = "$lessmsiDir\lessmsi.exe"
          Write-Host "Downloading lessmsi..."
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/activescott/lessmsi/releases/download/v1.10.0/lessmsi-v1.10.0.zip" -OutFile $lessmsiZip -UseBasicParsing
          Expand-Archive $lessmsiZip -DestinationPath $lessmsiDir -Force

          New-Item -ItemType Directory -Force -Path $hipPath | Out-Null
          foreach ($t in $targets) {
            $msi = Get-ChildItem "$rocmPkgs\$t" -Filter "*.msi" -ErrorAction SilentlyContinue |
                   Select-Object -First 1
            if ($msi) {
              $dest = "$hipPath\$t"
              Write-Host "Extracting $t via lessmsi..."
              & $lessmsi x $msi.FullName $dest\ 2>&1 | Select-Object -Last 3
            }
          }

          # lessmsi extracts into nested SourceDir path — flatten it to a clean root
          Write-Host "Finding hipcc in extraction..."
          # lessmsi may extract as hipcc or hipcc.exe — search for both
          $hipcc = Get-ChildItem $hipPath -Recurse -ErrorAction SilentlyContinue |
                   Where-Object { $_.Name -imatch "^hipcc(\.exe)?$" } |
                   Select-Object -First 1
          if (-not $hipcc) {
            Write-Host "hipcc not found. Top 30 files in extraction:"
            Get-ChildItem $hipPath -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 30 | ForEach-Object { Write-Host $_.FullName }
            Write-Error "hipcc not found after extraction"
            exit 1
          }

          $nestedRoot = Split-Path (Split-Path $hipcc.FullName)  # parent of bin
          Write-Host "Nested ROCm root: $nestedRoot"

          # Copy flattened SDK to clean path
          $cleanRoot = "C:\AMD\HIP"
          New-Item -ItemType Directory -Force -Path $cleanRoot | Out-Null
          Write-Host "Flattening to $cleanRoot ..."
          Copy-Item "$nestedRoot\*" $cleanRoot -Recurse -Force
          echo "HIP_PATH=$cleanRoot" >> $env:GITHUB_ENV

          # Also find and copy amdhip64.dll next to hipcc so cmake can run it
          $dll = Get-ChildItem $hipPath -Recurse -Filter "amdhip64.dll" -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if ($dll) {
            Copy-Item $dll.FullName "$cleanRoot\bin\" -Force
            Write-Host "Copied amdhip64.dll to bin"
          }
          Write-Host "hipcc at: $cleanRoot\bin\hipcc.exe"
          Get-ChildItem "$cleanRoot\bin" | Select-Object -First 8 | ForEach-Object { Write-Host " $($_.Name)" }

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          set PATH=%HIP_PATH%\bin;%PATH%
          cmake -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} ^
            -DSTARMINER_USE_ROCM=ON ^
            -DSTARMINER_USE_CUDA=OFF ^
            -DCMAKE_PREFIX_PATH="%HIP_PATH%" ^
            -DCMAKE_HIP_COMPILER="%HIP_PATH%\bin\clang++.exe" ^
            -DSTARMINER_BUILD_TESTS=OFF ^
            -DSTARMINER_BUILD_BENCHMARKS=OFF ^
            -DCMAKE_HIP_ARCHITECTURES="gfx1010;gfx1030;gfx1100;gfx1101;gfx1102"
          cmake --build build --target starminer -j4

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: starminer-windows-x64-hip
          path: build\starminer.exe

  # ── Windows x64 — CPU ───────────────────────────────────────────────
  windows-cpu:
    name: Windows x64 (CPU)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install Ninja
        run: choco install ninja -y

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} ^
            -DVCPKG_TARGET_TRIPLET=x64-windows-static ^
            -DSTARMINER_USE_CUDA=OFF ^
            -DSTARMINER_BUILD_TESTS=OFF ^
            -DSTARMINER_BUILD_BENCHMARKS=OFF
          cmake --build build --target starminer -j4

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: starminer-windows-x64-cpu
          path: build\starminer.exe

  # ── macOS ARM64 — Metal ─────────────────────────────────────────────
  macos-arm64:
    name: macOS ARM64 (Metal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install build tools
        run: brew install cmake ninja curl 2>/dev/null || true

      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DSTARMINER_USE_CUDA=OFF \
            -DSTARMINER_USE_METAL=ON \
             \
            -DSTARMINER_BUILD_TESTS=OFF \
            -DSTARMINER_BUILD_BENCHMARKS=OFF
          cmake --build build --target starminer -j4

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: starminer-macos-arm64
          path: build/starminer

  # ── Linux x64 — AMD ROCm/HIP ─────────────────────────────────────────
  linux-rocm:
    name: Linux x64 (ROCm/HIP)
    runs-on: ubuntu-22.04
    container:
      image: rocm/dev-ubuntu-22.04:6.2-complete
    steps:
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y git cmake ninja-build libcurl4-openssl-dev

      - uses: actions/checkout@v6.0.2

      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DSTARMINER_USE_CUDA=OFF \
            -DSTARMINER_USE_ROCM=ON \
             \
            -DSTARMINER_BUILD_TESTS=OFF \
            -DSTARMINER_BUILD_BENCHMARKS=OFF \
            -DCMAKE_HIP_ARCHITECTURES="gfx906;gfx908;gfx1030;gfx1100;gfx1101;gfx1102"
          cmake --build build --target starminer -j4
          strip build/starminer

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: starminer-linux-x64-rocm
          path: build/starminer

  # ── GitHub Release ───────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [linux-cuda, linux-cpu, linux-rocm, windows-cuda, windows-cpu, macos-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Rename to final filenames
        run: |
          cp artifacts/starminer-linux-x64-cuda/starminer        starminer-linux-x64-cuda
          cp artifacts/starminer-linux-x64-cpu/starminer         starminer-linux-x64-cpu
          cp artifacts/starminer-linux-x64-rocm/starminer        starminer-linux-x64-rocm
          cp artifacts/starminer-windows-x64-cuda/starminer.exe  starminer-windows-x64-cuda.exe
          cp artifacts/starminer-windows-x64-hip/starminer.exe   starminer-windows-x64-hip.exe
          cp artifacts/starminer-windows-x64-cpu/starminer.exe   starminer-windows-x64-cpu.exe
          cp artifacts/starminer-macos-arm64/starminer            starminer-macos-arm64
          chmod +x starminer-linux-x64-cuda starminer-linux-x64-cpu starminer-linux-x64-rocm starminer-macos-arm64
          ls -lh starminer-*

      - name: Publish
        uses: softprops/action-gh-release@v3.0.0
        with:
          generate_release_notes: true
          files: |
            starminer-linux-x64-cuda
            starminer-linux-x64-cpu
            starminer-linux-x64-rocm
            starminer-windows-x64-cuda.exe
            starminer-windows-x64-hip.exe
            starminer-windows-x64-cpu.exe
            starminer-macos-arm64
          body: |
            ## StarMiner ${{ github.ref_name }}

            GPU-accelerated Puzzle #135 solver — connects to **starnetlive.space**

            ### Quick start

            **1. Download the binary for your platform** (see table below)

            **2. Run it:**
            ```bash
            # Linux / macOS
            chmod +x starminer-linux-x64-cuda
            ./starminer-linux-x64-cuda --pool jlps://starnetlive.space:17403 --worker YOUR_BTC_ADDRESS

            # Windows
            .\starminer-windows-x64-cuda.exe --pool jlps://starnetlive.space:17403 --worker YOUR_BTC_ADDRESS
            ```

            Or launch without arguments for the interactive menu:
            ```bash
            ./starminer-linux-x64-cuda
            ```

            ### Platform binaries

            | Platform | Binary | GPU |
            |----------|--------|-----|
            | Linux x64 | `starminer-linux-x64-cuda` | NVIDIA CUDA |
            | Linux x64 | `starminer-linux-x64-rocm` | AMD ROCm |
            | Linux x64 | `starminer-linux-x64-cpu` | Any CPU (no GPU) |
            | Windows x64 | `starminer-windows-x64-cuda.exe` | NVIDIA CUDA |
            | Windows x64 | `starminer-windows-x64-cpu.exe` | Any CPU (no GPU) |
            | macOS ARM64 | `starminer-macos-arm64` | Apple Metal |

            Pool dashboard: **https://starnetlive.space/puzzle135**