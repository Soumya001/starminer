name: Build and Release StarMiner

# Builds starminer for all platforms and publishes binaries to GitHub Releases.
# Binary names match exactly what install-135.sh / install-135.ps1 download:
#   starminer-linux-x64-cuda
#   starminer-linux-x64-cpu
#   starminer-windows-x64-cuda.exe
#   starminer-windows-x64-cpu.exe
#   starminer-macos-arm64
#
# Trigger: push a tag  v1.5.1  →  builds all platforms + creates release
#          workflow_dispatch     →  builds all platforms (no release)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Linux x64 — CUDA ────────────────────────────────────────────────
  linux-cuda:
    name: Linux x64 (CUDA)
    runs-on: ubuntu-22.04
    container:
      image: nvidia/cuda:12.8.0-devel-ubuntu22.04
    steps:
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y git cmake ninja-build libcurl4-openssl-dev wget gpg ca-certificates
          # CMake 3.28+ needed for CUDA C++20
          wget -qO- https://apt.kitware.com/keys/kitware-archive-latest.asc \
            | gpg --dearmor -o /usr/share/keyrings/kitware-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] \
            https://apt.kitware.com/ubuntu/ jammy main" \
            > /etc/apt/sources.list.d/kitware.list
          apt-get update -qq && apt-get install -y cmake

      - uses: actions/checkout@v6.0.2

      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DSTARMINER_USE_CUDA=ON \
             \
            -DSTARMINER_BUILD_TESTS=OFF \
            -DSTARMINER_BUILD_BENCHMARKS=OFF \
            -DCMAKE_CUDA_ARCHITECTURES="61;70;75;80;86;89;100;120"
          cmake --build build --target starminer -j4
          strip build/starminer

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: starminer-linux-x64-cuda
          path: build/starminer

  # ── Linux x64 — CPU ─────────────────────────────────────────────────
  linux-cpu:
    name: Linux x64 (CPU)
    runs-on: ubuntu-22.04
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev

      - uses: actions/checkout@v6.0.2

      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DSTARMINER_USE_CUDA=OFF \
             \
            -DSTARMINER_BUILD_TESTS=OFF \
            -DSTARMINER_BUILD_BENCHMARKS=OFF
          cmake --build build --target starminer -j4
          strip build/starminer

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: starminer-linux-x64-cpu
          path: build/starminer

  # ── Windows x64 — CUDA ──────────────────────────────────────────────
  windows-cuda:
    name: Windows x64 (CUDA)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install CUDA 12.8
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.8.0"
          method: network
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'

      - name: Install Ninja
        run: choco install ninja -y

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} ^
            -DVCPKG_TARGET_TRIPLET=x64-windows-static ^
            -DSTARMINER_USE_CUDA=ON ^
            -DSTARMINER_BUILD_TESTS=OFF ^
            -DSTARMINER_BUILD_BENCHMARKS=OFF ^
            -DCMAKE_CUDA_ARCHITECTURES="61;70;75;80;86;89;100;120"
          cmake --build build --target starminer -j4

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: starminer-windows-x64-cuda
          path: build\starminer.exe

  # ── Windows x64 — HIP/AMD (RDNA1+: RX 5000/6000/7000) ─────────────
  windows-hip:
    name: Windows x64 (HIP/AMD)
    runs-on: windows-2022
    env:
      HIP_VERSION: "6.3.0"
      HIP_PATH: "C:\\Program Files\\AMD\\ROCm\\6.3"
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Cache AMD HIP SDK
        id: cache-hip
        uses: actions/cache@v4
        with:
          path: ${{ env.HIP_PATH }}
          key: amd-hip-sdk-${{ env.HIP_VERSION }}-windows

      - name: Install AMD HIP SDK
        if: steps.cache-hip.outputs.cache-hit != 'true'
        shell: cmd
        timeout-minutes: 40
        run: |
          set URL=https://download.amd.com/developer/eula/rocm-hub/AMD-Software-PRO-Edition-24.Q4-Win10-Win11-For-HIP.exe
          set INSTALLER=%TEMP%\hip-sdk.exe
          set EXTRACT=%TEMP%\hip-extract
          echo Downloading AMD HIP SDK via curl.exe...
          curl.exe -L --retry 3 --retry-delay 5 -o "%INSTALLER%" "%URL%"
          if errorlevel 1 ( echo Download failed & exit /b 1 )
          echo Download complete. Extracting with 7-Zip...
          "C:\Program Files\7-Zip\7z.exe" x "%INSTALLER%" -o"%EXTRACT%" -y
          if errorlevel 1 ( echo Extraction failed & exit /b 1 )
          echo Extraction done. Searching for hipcc...
          dir "%EXTRACT%" /s /b | findstr /i "hipcc"
          echo Top-level contents:
          dir "%EXTRACT%"

      - name: Copy HIP files to install path
        if: steps.cache-hip.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $extract = "$env:TEMP\hip-extract"
          Write-Host "Searching for hipcc in: $extract"
          $hits = Get-ChildItem $extract -Recurse -Filter "hipcc*" -ErrorAction SilentlyContinue
          if (-not $hits) {
            Write-Host "hipcc not found. Full tree (depth 3):"
            Get-ChildItem $extract -Recurse -Depth 3 | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          $hipBin  = Split-Path $hits[0].FullName
          $hipRoot = Split-Path $hipBin
          Write-Host "HIP root detected: $hipRoot"
          Write-Host "Copying to ${{ env.HIP_PATH }} ..."
          New-Item -ItemType Directory -Force -Path "${{ env.HIP_PATH }}" | Out-Null
          Copy-Item "$hipRoot\*" "${{ env.HIP_PATH }}" -Recurse -Force
          Write-Host "Copy complete."

      - name: Verify HIP installation
        shell: cmd
        run: |
          dir "${{ env.HIP_PATH }}\bin" 2>nul || echo bin dir missing
          if exist "${{ env.HIP_PATH }}\bin\hipcc.bin.exe" ( echo HIP OK & exit /b 0 )
          if exist "${{ env.HIP_PATH }}\bin\hipcc"         ( echo HIP OK & exit /b 0 )
          echo HIP not found - listing HIP_PATH:
          dir "${{ env.HIP_PATH }}" /s /b 2>nul
          exit /b 1

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} ^
            -DSTARMINER_USE_ROCM=ON ^
            -DSTARMINER_USE_CUDA=OFF ^
            -DCMAKE_PREFIX_PATH="${{ env.HIP_PATH }}" ^
            -DSTARMINER_BUILD_TESTS=OFF ^
            -DSTARMINER_BUILD_BENCHMARKS=OFF ^
            -DCMAKE_HIP_ARCHITECTURES="gfx1010;gfx1030;gfx1100;gfx1101;gfx1102"
          cmake --build build --target starminer -j4

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: starminer-windows-x64-hip
          path: build\starminer.exe

  # ── Windows x64 — CPU ───────────────────────────────────────────────
  windows-cpu:
    name: Windows x64 (CPU)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install Ninja
        run: choco install ninja -y

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} ^
            -DVCPKG_TARGET_TRIPLET=x64-windows-static ^
            -DSTARMINER_USE_CUDA=OFF ^
            -DSTARMINER_BUILD_TESTS=OFF ^
            -DSTARMINER_BUILD_BENCHMARKS=OFF
          cmake --build build --target starminer -j4

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: starminer-windows-x64-cpu
          path: build\starminer.exe

  # ── macOS ARM64 — Metal ─────────────────────────────────────────────
  macos-arm64:
    name: macOS ARM64 (Metal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install build tools
        run: brew install cmake ninja curl 2>/dev/null || true

      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DSTARMINER_USE_CUDA=OFF \
            -DSTARMINER_USE_METAL=ON \
             \
            -DSTARMINER_BUILD_TESTS=OFF \
            -DSTARMINER_BUILD_BENCHMARKS=OFF
          cmake --build build --target starminer -j4

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: starminer-macos-arm64
          path: build/starminer

  # ── Linux x64 — AMD ROCm/HIP ─────────────────────────────────────────
  linux-rocm:
    name: Linux x64 (ROCm/HIP)
    runs-on: ubuntu-22.04
    container:
      image: rocm/dev-ubuntu-22.04:6.2-complete
    steps:
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y git cmake ninja-build libcurl4-openssl-dev

      - uses: actions/checkout@v6.0.2

      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DSTARMINER_USE_CUDA=OFF \
            -DSTARMINER_USE_ROCM=ON \
             \
            -DSTARMINER_BUILD_TESTS=OFF \
            -DSTARMINER_BUILD_BENCHMARKS=OFF \
            -DCMAKE_HIP_ARCHITECTURES="gfx906;gfx908;gfx1030;gfx1100;gfx1101;gfx1102"
          cmake --build build --target starminer -j4
          strip build/starminer

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: starminer-linux-x64-rocm
          path: build/starminer

  # ── GitHub Release ───────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [linux-cuda, linux-cpu, linux-rocm, windows-cuda, windows-hip, windows-cpu, macos-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Rename to final filenames
        run: |
          cp artifacts/starminer-linux-x64-cuda/starminer        starminer-linux-x64-cuda
          cp artifacts/starminer-linux-x64-cpu/starminer         starminer-linux-x64-cpu
          cp artifacts/starminer-linux-x64-rocm/starminer        starminer-linux-x64-rocm
          cp artifacts/starminer-windows-x64-cuda/starminer.exe  starminer-windows-x64-cuda.exe
          cp artifacts/starminer-windows-x64-hip/starminer.exe   starminer-windows-x64-hip.exe
          cp artifacts/starminer-windows-x64-cpu/starminer.exe   starminer-windows-x64-cpu.exe
          cp artifacts/starminer-macos-arm64/starminer            starminer-macos-arm64
          chmod +x starminer-linux-x64-cuda starminer-linux-x64-cpu starminer-linux-x64-rocm starminer-macos-arm64
          ls -lh starminer-*

      - name: Publish
        uses: softprops/action-gh-release@v3.0.0
        with:
          generate_release_notes: true
          files: |
            starminer-linux-x64-cuda
            starminer-linux-x64-cpu
            starminer-linux-x64-rocm
            starminer-windows-x64-cuda.exe
            starminer-windows-x64-hip.exe
            starminer-windows-x64-cpu.exe
            starminer-macos-arm64
          body: |
            ## StarMiner ${{ github.ref_name }}

            GPU-accelerated Puzzle #135 solver — connects to **starnetlive.space**

            ### Quick start

            **1. Download the binary for your platform** (see table below)

            **2. Run it:**
            ```bash
            # Linux / macOS
            chmod +x starminer-linux-x64-cuda
            ./starminer-linux-x64-cuda --pool jlps://starnetlive.space:17403 --worker YOUR_BTC_ADDRESS

            # Windows
            .\starminer-windows-x64-cuda.exe --pool jlps://starnetlive.space:17403 --worker YOUR_BTC_ADDRESS
            ```

            Or launch without arguments for the interactive menu:
            ```bash
            ./starminer-linux-x64-cuda
            ```

            ### Platform binaries

            | Platform | Binary | GPU |
            |----------|--------|-----|
            | Linux x64 | `starminer-linux-x64-cuda` | NVIDIA CUDA |
            | Linux x64 | `starminer-linux-x64-rocm` | AMD ROCm |
            | Linux x64 | `starminer-linux-x64-cpu` | Any CPU (no GPU) |
            | Windows x64 | `starminer-windows-x64-cuda.exe` | NVIDIA CUDA |
            | Windows x64 | `starminer-windows-x64-cpu.exe` | Any CPU (no GPU) |
            | macOS ARM64 | `starminer-macos-arm64` | Apple Metal |

            Pool dashboard: **https://starnetlive.space/puzzle135**